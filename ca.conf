# /etc/ssh/sshd_config (or a drop-in at /etc/ssh/sshd_config.d/ca-server.conf)

TrustedUserCAKeys /etc/ssl/machine-enoroll/ssh-ca.key.pub

Match User machine-enroll
    ForceCommand /usr/local/src/renew-ca/server.py
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
    PasswordAuthentication no   # cert auth only for this user
    KbdInteractiveAuthentication no
